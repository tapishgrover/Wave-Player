name: Build Wave Player (Sideload)

on:
  push:
    branches: [ feature/audio-settings ]   # triggers only on this branch
  workflow_dispatch:                        # allows manual run

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app
      - name: Build app (unsigned)
        run: |
          xcodebuild build -project flo.xcodeproj \
            -scheme flo \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            -derivedDataPath ./DerivedData
      - name: Upload .app artifact
        uses: actions/upload-artifact@v3
        with:
          name: WavePlayer
          path: DerivedData/Build/Products/Release-iphoneos/*.app
